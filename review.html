<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review — The Cutting Edge Belfast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #c4607e; --accent-light: #e8b4c8; --dark: #120a0e; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 700; color: var(--accent-light); margin-bottom: 2.5rem; text-align: center; line-height: 1.2; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(232,180,200,0.18); border-radius: 12px; padding: 3rem 2.5rem; max-width: 500px; width: 100%; text-align: center; }
  .card h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--accent-light); }
  .card p { color: rgba(232,180,200,0.6); font-size: 0.95rem; line-height: 1.7; margin-bottom: 2rem; }
  .rating-label { font-size: 0.8rem; font-weight: 600; color: rgba(232,180,200,0.5); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
  .stars-row { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
  .star-btn { font-size: 2.5rem; background: none; border: none; cursor: pointer; transition: transform 0.15s; filter: grayscale(1) opacity(0.35); }
  .star-btn.active { filter: none; transform: scale(1.1); }
  .btn { display: inline-block; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.95rem; padding: 0.95rem 2rem; border-radius: 4px; text-decoration: none; width: 100%; text-align: center; border: none; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #b0526e; }
  .btn-private { background: transparent; color: rgba(232,180,200,0.5); border: 1px solid rgba(232,180,200,0.2); margin-top: 1rem; }
  .btn-private:hover { border-color: var(--accent-light); color: var(--accent-light); background: transparent; }
</style>
</head>
<body>
  <div class="logo">The Cutting Edge<br>Belfast</div>
  <div class="card">
    <h1>How Was Your Visit?</h1>
    <p>We love hearing from our clients. If you had a wonderful experience, please leave us a Google review — it only takes a moment and it means so much to our team.</p>
    <div class="rating-label">Rate your experience</div>
    <div class="stars-row" id="starsRow">
      <button class="star-btn" data-val="1" onclick="handleStar(1)">⭐</button>
      <button class="star-btn" data-val="2" onclick="handleStar(2)">⭐</button>
      <button class="star-btn" data-val="3" onclick="handleStar(3)">⭐</button>
      <button class="star-btn" data-val="4" onclick="handleStar(4)">⭐</button>
      <button class="star-btn" data-val="5" onclick="handleStar(5)">⭐</button>
    </div>
    <div id="actionArea">
      <p style="color:rgba(232,180,200,0.4);font-size:0.88rem;">Select your rating above</p>
    </div>
  </div>
  <script>
    function handleStar(val) {
      document.querySelectorAll('.star-btn').forEach((b, i) => b.classList.toggle('active', i < val));
      const area = document.getElementById('actionArea');
      if (val >= 4) {
        area.innerHTML = `<a href="https://g.page/r/review" target="_blank" class="btn">Leave a Google Review ⭐</a>`;
      } else {
        area.innerHTML = `<p style="color:rgba(232,180,200,0.6);font-size:0.9rem;margin-bottom:1rem;">We're sorry to hear that. Please share your thoughts privately and we'll make it right.</p><a href="private.html" class="btn btn-private">Share Private Feedback</a>`;
      }
    }
  </script>
</body>
</html>
